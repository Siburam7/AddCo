<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./output.css" />
  <link rel="stylesheet" href="addExpense.css">
  <link rel="stylesheet" href="myPurchases.css">
  <link rel="stylesheet" href="budget.css">
  <title>TailWind Pratice</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
  <nav>
    <div class="nav-top">
      <div class="div-left">
        <i class="fa-solid fa-bars"></i>
        <i class="fa-solid fa-x"></i>
        <div class="logo-main"></div>

      </div>

      <div class="user">
        <h4>Login</h4>
        <div class="img-user"><i class="fa-solid fa-user"></i></div>
      </div>
    </div>
    <div class="nav-button">
      <h2 class="text-top-nav-buttom">Track everything you bought this month</h2>


      <div class="manu-allText">
        <h1 class="toogleNavBottom"><i class="fa-solid fa-house"></i>Dashboard</h1>
        <h1><i class="fa-solid fa-circle-plus"></i>Add Expense</h1>
        <h1><i class="fa-solid fa-cart-shopping"></i>My Purchases</h1>
        <h1><i class="fa-solid fa-chart-pie"></i>Budget</h1>
        <h1><i class="fa-solid fa-chart-simple"></i>Reports</h1>
        <h1><i class="fa-solid fa-layer-group"></i>Categories</h1>
        <h1><i class="fa-solid fa-gear"></i>Setting</h1>
        <h1 id="log-out"><i class="fa-solid fa-right-from-bracket"></i> Logout</h1>
      </div>
    </div>
  </nav>


  <div class="dashBord footerMinGroup">-
  </div>

  <div class="addExpense-page footerMinGroup">

    <label>Amount</label>

    <div class="input-boxAddExpense">
      <i class="fa-solid fa-indian-rupee-sign"></i>
      <input type="number" placeholder="Enter amount">
    </div>



    <label>Category</label>

    <div class="select-boxAddExpense">
      <i class="fa-solid fa-layer-group"></i>
      <select id="category" name="category">
        <option value="">Select Category</option>
        <option value="electronics">Electronics</option>
        <option value="clothing">Clothing</option>
        <option value="food">Food</option>
        <option value="grocery">Grocery</option>
        <option value="other">Other</option>
      </select>
    </div>



    <label>Date</label>

    <div class="input-boxAddExpense">
      <i class="fa-regular fa-calendar-days"></i>
      <input type="date" id="dateInput">
    </div>



    <label>Payment Method</label>

    <div class="select-boxAddExpense">
      <i class="fa-solid fa-wallet"></i>
      <select id="category" name="category">
        <option value="">Select Payment Method</option>
        <option value="cash">Cash</option>
        <option value="upi">UPI</option>
        <option value="debit-card">Debit Card</option>
        <option value="credit-card">Credit Card</option>
        <option value="bank-transfer">Bank Transfer</option>
        <option value="net-banking">Net Banking</option>
        <option value="wallet">Wallet</option>
        <option value="emi">EMI</option>
        <option value="other">Other</option>
      </select>
    </div>




    <label>Description(Optional)</label>

    <div class="input-boxAddExpense">
      <i class="fa-solid fa-pen-to-square"></i>
      <textarea id="description" placeholder="Enter description"></textarea>
    </div>

    <div class="btn-add-expense">Add Expense</div>
    <div class="btn-add-expense-cancel">Cancel</div>

  </div>

  <div class=" myPurchases-page footerMinGroup">++
  </div>

  <div class="budget-page footerMinGroup">+++</div>

  <div class="reports-page footerMinGroup">++++</div>

  <div class="Categories-page footerMinGroup">+++++</div>

  <div class="setting-page footerMinGroup">++++++</div>

  <footer>
    <div class="footer-min active-footer">
      <i class="fa-solid fa-house"></i>
      <h3>Dashboard</h3>
    </div>
    <div class="footer-min">
      <i class="fa-solid fa-circle-plus"></i>
      <h3>Add Expense</h3>
    </div>
    <div class="footer-min">
      <i class="fa-solid fa-cart-shopping"></i>
      <h3>My Purchases</h3>
    </div>
    <div class="footer-min">
      <i class="fa-solid fa-chart-pie"></i>
      <h3>Budget</h3>
    </div>
  </footer>


  <script src="./pratice/noting.js"></script>
</body>

</html>
