<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUpHome</title>
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="login-signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<div class="login-body-main">
    <div class="content-boxx-login">
        <div class="img-logo-top"></div>

        <h1 id="welcome-back">Create Account!</h1>
        <p class="bio-P-graph">Create an account to get started</p>

        <label class="label-grp label-grp-login">

            <input type="text" placeholder="Username" id="userName">


            <input type="email" placeholder="Email" id="userName">


            <div class="password-box">
                <input type="password" placeholder="Password" id="passWord">
                <i class="fa-solid fa-eye-slash"></i>
            </div>


            <div class="password-box">
                <input type="password" placeholder="Confirm Password" id="passWord">

            </div>
        </label>

        <div class="remember-forget-contner">
            <label id="check-box-main">
                <input type="checkbox">
                I agree to the Terms & Conditions and Privacy Policy
            </label>
        </div>

        <div class="btn-sign-up log-in-btn">Sign Up</div>
        <h4 id="signUp-line">Already have an account?<span><a class="log-in-btn" href="#">Log in</a></span></h4>

    </div>
    <div class="login-footer"> ©2026 AddCo. Privacy. terms</div>
    <script src="./pratice/login-signup.js"></script>
</div>

</html>
