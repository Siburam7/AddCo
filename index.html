<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginHome</title>
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="login-signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<div class="login-body-main">
    <div class="content-boxx-login">
        <div class="img-logo-top"></div>

        <h1 id="welcome-back">Welcome Back!</h1>
        <p class="bio-P-graph">Login to continue to your account</p>

        <label class="label-grp">
            <label>Username</label>
            <input type="text" placeholder="e.g. Addco" id="userName">

            <label>Password</label>
            <div class="password-box">
                <input type="password" placeholder="e.g. ******" id="passWord">
                <i class="fa-solid fa-eye-slash"></i>
            </div>
        </label>

        <div class="remember-forget-contner">
            <label>
                <input type="checkbox">
                Remember me
            </label>

            <a href="#">Forgot Password?</a>
        </div>

        <div class="btn-login">Login</div>
        <h4 id="signUp-line">Don't have an account?<span><a id="sign-up-btn" href="#">Sign up</a></span></h4>

    </div>
    <div class="login-footer"> ©2026 AddCo. Privacy. termss</div>
    <script src="/pratice/login-signup.js"></script>
</div>

</html>
