<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginHome</title>
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<div class="login-body-main">
    <!-- <div class="addCo-logo"></div>
    <h1 id="addCo-text">AddCo</h1> -->
    <h1 id="welcome-back">Welcome Back!</h1>
    <p class="bio-P-graph">Login to continue to your account</p>

    <label id="label-grp">
        <label>Username</label>
        <input type="text" placeholder="Username" id="userName">
        <label>Password</label>
        <input type="password" placeholder="Password" id="passWord">
    </label>

    <div class="remember-forget-contner">
        <label>
            <input type="checkbox">
            Remember me
        </label>

        <a href="#">Forgot Password?</a>
    </div>

    <div class="btn-login">Login</div>
    <h4 id="signUp-line">Don't have an account?<span><a href="#">Sign up</a></span></h4>


    <script src="login.js"></script>
</div>

</html>
